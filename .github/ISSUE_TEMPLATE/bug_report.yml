name: Bug report
description: Something behaves differently from what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real questions, birth data or
        exported ledgers — reproduce with fictional input instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact text you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If a doc promised this behaviour, link the file and line.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /#/ask
        2. Enter a fictional question
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the README heading, e.g. v0.2.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chromium / Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
