name: Update Featured Projects

on:
  schedule:
    - cron: "0 0 */6 * *"  # 6 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "README.md"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

jobs:
  update:
    name: Refresh project sections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m scripts.test_scripts

      - name: Update project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python -m scripts.update_projects

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): refresh featured projects [skip ci]"
            git push
          fi
