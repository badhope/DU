name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 8 * * *"  # Daily at 4 PM UTC+8
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: |
            ⚠️ This issue has been marked as stale due to inactivity.
            It will be closed in 7 days if no further activity occurs.
          stale-pr-message: |
            ⚠️ This PR has been marked as stale due to inactivity.
            It will be closed in 7 days if no further activity occurs.
          close-issue-message: |
            🔒 Closing this issue due to inactivity. Feel free to reopen if needed.
          close-pr-message: |
            🔒 Closing this PR due to inactivity. Feel free to reopen if you want to continue.
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,important,bug"
          exempt-pr-labels: "pinned,important,wip"
