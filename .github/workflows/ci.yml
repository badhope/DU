name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # public/corpus 随仓库提交：它是部署产物的一部分（阅览室要 fetch 它），
      # 但体积大，CI 里不做抓取，只跑门禁。
      - run: npm ci
      - run: npm run check
      - name: 产物体积
        run: du -sh dist && du -sh dist/assets
