name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet new contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hello! Thanks for opening your first issue. We appreciate your contribution!
            Please make sure you've read our contributing guidelines.
          pr-message: |
            🎉 Congratulations on your first pull request!
            Thank you for contributing to this project. Our team will review it soon.
