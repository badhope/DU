pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,vue,cjs}"
      run: pnpm exec eslint --fix {staged_files}
    format:
      glob: "*.{js,ts,vue,cjs,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
