<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 50" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 渐变动画 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0">
        <animate attributeName="stop-color" values="#58a6ff;#f778ba;#58a6ff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#f778ba;stop-opacity:1">
        <animate attributeName="stop-color" values="#f778ba;#58a6ff;#f778ba" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0">
        <animate attributeName="stop-color" values="#58a6ff;#f778ba;#58a6ff" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 菱形符号 -->
    <symbol id="diamond">
      <polygon points="5,0 10,5 5,10 0,5" fill="#58a6ff"/>
    </symbol>
  </defs>

  <!-- 主线条 -->
  <line x1="50" y1="25" x2="1150" y2="25" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- 中心装饰 -->
  <use href="#diamond" x="595" y="20">
    <animateTransform attributeName="transform" type="rotate" from="0 600 25" to="360 600 25" dur="4s" repeatCount="indefinite"/>
  </use>

  <!-- 左侧装饰点 -->
  <circle cx="300" cy="25" r="3" fill="#58a6ff" opacity="0.8">
    <animate attributeName="r" values="3;4;3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="25" r="2" fill="#f778ba" opacity="0.6">
    <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 右侧装饰点 -->
  <circle cx="900" cy="25" r="3" fill="#58a6ff" opacity="0.8">
    <animate attributeName="r" values="3;4;3" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="25" r="2" fill="#f778ba" opacity="0.6">
    <animate attributeName="r" values="2;3;2" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 两侧小点 -->
  <circle cx="150" cy="25" r="1.5" fill="#c9d1d9" opacity="0.5"/>
  <circle cx="1050" cy="25" r="1.5" fill="#c9d1d9" opacity="0.5"/>
</svg>
