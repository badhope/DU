<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00F5FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00F5FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M0 30 L100 30 L120 10 L140 50 L160 20 L180 40 L200 30 L800 30"
        stroke="url(#pulseGrad)" stroke-width="2" fill="none" filter="url(#pulseGlow)"/>
  <circle cx="120" cy="10" r="4" fill="#00F5FF" filter="url(#pulseGlow)"/>
  <circle cx="140" cy="50" r="4" fill="#7c3aed" filter="url(#pulseGlow)"/>
  <circle cx="160" cy="20" r="3" fill="#06b6d4" filter="url(#pulseGlow)"/>
  <circle cx="180" cy="40" r="3" fill="#00F5FF" filter="url(#pulseGlow)"/>
</svg>