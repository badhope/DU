<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#00F5FF;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="55" width="800" height="4" fill="url(#neonGrad)" filter="url(#glow)"/>
  <rect x="200" y="50" width="4" height="20" fill="#00F5FF" filter="url(#glow)" opacity="0.8"/>
  <rect x="400" y="48" width="6" height="24" fill="#7c3aed" filter="url(#glow)" opacity="0.9"/>
  <rect x="600" y="50" width="4" height="20" fill="#00F5FF" filter="url(#glow)" opacity="0.8"/>
  <circle cx="200" cy="57" r="3" fill="#00F5FF" filter="url(#glow)"/>
  <circle cx="400" cy="57" r="4" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="600" cy="57" r="3" fill="#00F5FF" filter="url(#glow)"/>
</svg>