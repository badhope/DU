<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#00F5FF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#00F5FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00F5FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="bannerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bannerBg)"/>
  <rect x="20" y="20" width="760" height="160" rx="8" fill="none" stroke="url(#neonLine)" stroke-width="1.5" filter="url(#bannerGlow)" opacity="0.6"/>
  <rect x="30" y="30" width="740" height="140" rx="6" fill="none" stroke="#00F5FF" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="100" x2="50" y2="100" stroke="#00F5FF" stroke-width="2" filter="url(#bannerGlow)"/>
  <line x1="750" y1="100" x2="800" y2="100" stroke="#00F5FF" stroke-width="2" filter="url(#bannerGlow)"/>
  <circle cx="50" cy="100" r="4" fill="#7c3aed" filter="url(#bannerGlow)"/>
  <circle cx="750" cy="100" r="4" fill="#7c3aed" filter="url(#bannerGlow)"/>
  <polygon points="395,60 410,85 400,85 415,115 395,90 405,90" fill="#00F5FF" filter="url(#bannerGlow)" opacity="0.8"/>
</svg>