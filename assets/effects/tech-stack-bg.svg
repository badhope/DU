<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0.9"/>
    </linearGradient>

    <!-- 边框渐变动画 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.5">
        <animate attributeName="stop-color" values="#58a6ff;#f778ba;#58a6ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f778ba;stop-opacity:0.5">
        <animate attributeName="stop-color" values="#f778ba;#58a6ff;#f778ba" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 代码符号 -->
    <symbol id="code-icon">
      <text x="0" y="0" font-family="monospace" font-size="16" fill="#58a6ff" opacity="0.3">&lt;/&gt;</text>
    </symbol>
  </defs>

  <!-- 卡片背景 -->
  <rect x="10" y="10" width="380" height="280" rx="15" ry="15" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- 装饰性代码符号 -->
  <use href="#code-icon" x="30" y="40"/>
  <use href="#code-icon" x="320" y="260"/>

  <!-- 角落装饰 -->
  <circle cx="25" cy="25" r="4" fill="#58a6ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="375" cy="25" r="4" fill="#f778ba" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="275" r="4" fill="#f778ba" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="375" cy="275" r="4" fill="#58a6ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 动态粒子效果 -->
  <circle cx="200" cy="50" r="2" fill="#58a6ff" opacity="0.4">
    <animate attributeName="cy" values="50;45;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="150" r="1.5" fill="#f778ba" opacity="0.3">
    <animate attributeName="cx" values="100;105;100" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="200" r="1.5" fill="#58a6ff" opacity="0.3">
    <animate attributeName="cy" values="200;195;200" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 中心标题区域占位 -->
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c9d1d9">
    Section Title
  </text>
  <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    Content goes here
  </text>

  <!-- 底部装饰线 -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#58a6ff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>
