<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0.98"/>
    </linearGradient>
    
    <linearGradient id="borderFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#58a6ff;#f778ba;#58a6ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f778ba;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#f778ba;#58a6ff;#f778ba" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="10" y="10" width="430" height="260" rx="20" ry="20" fill="url(#cardBg)" stroke="url(#borderFlow)" stroke-width="2.5"/>
  
  <text x="225" y="50" text-anchor="middle" fill="#58a6ff" font-size="24" font-weight="bold" font-family="Arial, sans-serif">
    👋 Hey there!
  </text>
  
  <text x="225" y="85" text-anchor="middle" fill="#c9d1d9" font-size="16" font-family="Arial, sans-serif">
    I'm badhope
  </text>
  
  <line x1="50" y1="105" x2="400" y2="105" stroke="#30363d" stroke-width="1"/>
  
  <text x="50" y="135" fill="#8b949e" font-size="13" font-family="Arial, sans-serif">
    🎯 Focus: AI Agent Development
  </text>
  
  <text x="50" y="160" fill="#8b949e" font-size="13" font-family="Arial, sans-serif">
    📍 Location: Shenzhen, China
  </text>
  
  <text x="50" y="185" fill="#8b949e" font-size="13" font-family="Arial, sans-serif">
    💼 Role: Full-Stack Developer
  </text>
  
  <text x="50" y="210" fill="#8b949e" font-size="13" font-family="Arial, sans-serif">
    🚀 Status: Open to Opportunities
  </text>
  
  <text x="50" y="235" fill="#8b949e" font-size="13" font-family="Arial, sans-serif">
    📧 Email: x18825407105@outlook.com
  </text>
  
  <circle cx="380" cy="240" r="8" fill="#58a6ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
