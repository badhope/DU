<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <!-- 玻璃态渐变 -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.05)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1)"/>
    </linearGradient>

    <!-- 星星光晕 -->
    <radialGradient id="cardStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#a5f3fc;stop-opacity:0"/>
    </radialGradient>

    <!-- 边缘流光 -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#f9a8d4;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#a5f3fc;stop-opacity:0.3"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="cardBlur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 玻璃态背景 -->
  <rect x="5" y="5" width="390" height="240" rx="15" fill="url(#glassGradient)"/>

  <!-- 边缘光晕 -->
  <rect x="5" y="5" width="390" height="240" rx="15" fill="none" stroke="url(#edgeGlow)" stroke-width="1.5" filter="url(#softGlow)">
    <animate attributeName="stroke-width" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- 内发光 -->
  <rect x="10" y="10" width="380" height="230" rx="12" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- 星星装饰 - 左上 -->
  <g filter="url(#softGlow)">
    <path d="M30,30 L32,28 L34,30 L32,32 Z" fill="#fef3c7">
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="25" cy="40" r="1" fill="#e0f2fe">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星星装饰 - 右上 -->
  <g filter="url(#softGlow)">
    <path d="M370,30 L372,28 L374,30 L372,32 Z" fill="#a5f3fc">
      <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <circle cx="375" cy="45" r="1.2" fill="#f9a8d4">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星星装饰 - 左下 -->
  <g filter="url(#softGlow)">
    <circle cx="35" cy="220" r="1.5" fill="#c4b5fd">
      <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <path d="M25,210 L26.5,208.5 L28,210 L26.5,211.5 Z" fill="#fef3c7">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星星装饰 - 右下 -->
  <g filter="url(#softGlow)">
    <circle cx="365" cy="215" r="1" fill="#a5f3fc">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <path d="M375,225 L376.5,223.5 L378,225 L376.5,226.5 Z" fill="#f9a8d4">
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- 内部微光 -->
  <circle cx="200" cy="125" r="80" fill="url(#cardStarGlow)">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 浮动粒子 -->
  <circle cx="100" cy="100" r="0.8" fill="#e0f2fe" opacity="0.4">
    <animate attributeName="cy" values="100;80;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="300" cy="150" r="0.6" fill="#f9a8d4" opacity="0.3">
    <animate attributeName="cy" values="150;170;150" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="180" r="0.7" fill="#c4b5fd" opacity="0.4">
    <animate attributeName="cy" values="180;160;180" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="250" cy="70" r="0.6" fill="#a5f3fc" opacity="0.3">
    <animate attributeName="cy" values="70;90;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
