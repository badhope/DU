<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" preserveAspectRatio="none">
  <defs>
    <linearGradient id="meteorTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:0"/>
    </linearGradient>

    <filter id="meteorGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 流星1 -->
  <g filter="url(#meteorGlow)">
    <ellipse cx="0" cy="30" rx="80" ry="2" fill="url(#meteorTrail)">
      <animate attributeName="cx" values="0;900;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="0" cy="30" r="3" fill="#fef3c7">
      <animate attributeName="cx" values="0;900;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4;3" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 流星2 -->
  <g filter="url(#meteorGlow)">
    <ellipse cx="0" cy="60" rx="60" ry="1.5" fill="url(#meteorTrail)">
      <animate attributeName="cx" values="-100;800;-100" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </ellipse>
    <circle cx="0" cy="60" r="2.5" fill="#e0f2fe">
      <animate attributeName="cx" values="-100;800;-100" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- 流星3 -->
  <g filter="url(#meteorGlow)">
    <ellipse cx="0" cy="45" rx="70" ry="1.8" fill="url(#meteorTrail)">
      <animate attributeName="cx" values="-50;850;-50" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
    </ellipse>
    <circle cx="0" cy="45" r="2.8" fill="#f9a8d4">
      <animate attributeName="cx" values="-50;850;-50" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="r" values="2.8;3.8;2.8" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
    </circle>
  </g>
</svg>
