<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="starGlowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#fef3c7;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <g filter="url(#starGlow)">
    <!-- 4角星形状 -->
    <g fill="#fef3c7">
      <path d="M50,50 L53,47 L56,50 L53,53 Z">
        <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </path>

      <path d="M150,80 L153,77 L156,80 L153,83 Z">
        <animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      </path>

      <path d="M250,40 L253,37 L256,40 L253,43 Z">
        <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2.2s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" begin="1s"/>
      </path>

      <path d="M350,70 L353,67 L356,70 L353,73 Z">
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
      </path>
    </g>

    <!-- 星星形状 -->
    <g fill="#e0f2fe">
      <circle cx="80" cy="120" r="2">
        <animate attributeName="r" values="2;3;2" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <circle cx="200" cy="100" r="2.5">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>

      <circle cx="320" cy="130" r="2">
        <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>

    <!-- 小星星 -->
    <g fill="#c4b5fd" opacity="0.6">
      <circle cx="120" cy="150" r="1">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>

      <circle cx="180" cy="160" r="1.2">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.3s" repeatCount="indefinite" begin="0.5s"/>
      </circle>

      <circle cx="280" cy="150" r="1">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite" begin="1s"/>
      </circle>

      <circle cx="370" cy="160" r="1.2">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
    </g>

    <!-- 浮动的星光粒子 -->
    <circle cx="100" cy="100" r="1" fill="#f9a8d4">
      <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="220" cy="130" r="0.8" fill="#a5f3fc">
      <animate attributeName="cy" values="130;150;130" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="300" cy="90" r="1" fill="#fef3c7">
      <animate attributeName="cy" values="90;70;90" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="380" cy="110" r="0.8" fill="#e0f2fe">
      <animate attributeName="cy" values="110;130;110" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <!-- 流星划过 -->
    <g opacity="0.5">
      <path d="M0,50 Q100,100 200,50" stroke="url(#starGlowGradient)" stroke-width="0.5" fill="none">
        <animate attributeName="d" values="M0,50 Q100,100 200,50;M200,50 Q300,100 400,50" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
